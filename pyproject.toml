[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bilingual-voice-agent"
version = "0.1.0"
description = "Configure an English and Arabic ElevenLabs voice agent as code and evaluate it with the Tests API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Husam El Tahir" }]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
voice-agent-setup = "voice_agent.setup_agent:main"
voice-agent-evals = "voice_agent.evals:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.hatch.build.targets.wheel.force-include]
"agent" = "voice_agent/agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
